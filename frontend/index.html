<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Marketplace buku cetak, ebook, dan audiobook terbitan Polibatam Press.">
    <meta name="theme-color" content="#1e376c">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Polibatam Press</title>
    <script>
      // Tema tersimpan (src/utils/tema.js) dipasang sebelum halaman digambar agar tidak berkedip terang.
      ;(function () {
        try {
          var tema = localStorage.getItem('polibatam-press.tema')
          if (tema === 'terang' || tema === 'gelap') document.documentElement.dataset.tema = tema
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
