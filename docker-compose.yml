name: polibatam-press

services:
  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  broker:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.48
    command: "server -s3"
    env_file: .env
    environment:
      # SeaweedFS mengaktifkan autentikasi S3 dari pasangan kunci ini
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweeddata:/data
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  django:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  celery:
    build: ./backend
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  # Penjadwal tugas berkala (CELERY_BEAT_SCHEDULE di settings.py): tiap 5 menit pesanan yang menunggu
  # pembayaran dicocokkan dengan Status API Midtrans. Berkas jadwal disimpan di /tmp container.
  celery-beat:
    build: ./backend
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      broker:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8080}:80"
    depends_on:
      - django

volumes:
  pgdata:
  seaweeddata:
