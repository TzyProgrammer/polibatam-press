# Token sesi streaming pada path /api/drm/stream/<token>/... disamarkan di access log.
map $request_uri $uri_untuk_log {
    "~^(?<awal>/api/drm/stream/)[^/]+(?<akhir>/.*)?$"  "${awal}***${akhir}";
    default                                            $request_uri;
}

log_format tanpa_token '$remote_addr - $remote_user [$time_local] "$request_method $uri_untuk_log $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    access_log /var/log/nginx/access.log tanpa_token;

    location / {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
