<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subjek }}</title>
</head>
{% comment %}Kerangka email HTML Polibatam Press. Gaya ditulis inline karena banyak aplikasi email mengabaikan <style>.{% endcomment %}
<body style="margin:0;padding:0;background:#f5f7fa;color:#1a1f2b;font-family:'Open Sans',Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e3e7ef;border-radius:12px;overflow:hidden;">
        <tr>
          <td style="background:#1e376c;padding:20px 24px;color:#ffffff;font-family:Montserrat,Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;letter-spacing:0.5px;">
            POLIBATAM PRESS
            <div style="width:48px;height:3px;margin-top:10px;background:#f2692a;border-radius:2px;"></div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px;font-size:15px;line-height:1.6;">
            {% block isi %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px;background:#eef1f7;color:#4a5161;font-size:12px;line-height:1.5;">
            {% block catatan %}{% endblock %}Email ini dikirim otomatis oleh Marketplace Polibatam Press, Politeknik Negeri Batam. Mohon tidak membalas email ini.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
